name: Windows x64 Build

on:
  workflow_dispatch:
  push:
    branches: ["**"]     # Run on push to any branch
  pull_request:
    branches: ["**"]     # Run on PR to any branch

jobs:
  run-make-install:
    runs-on: windows-2025  # Specify windows version 2025

    steps:
      # Install Inno Setup
      - name: Install Inno Setup
        run: choco install innosetup
        
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run makeAllInstalls.ps1
        working-directory: ./windows/install
        run: ./makeAllInstalls.ps1

      - name: get Installer names
        shell: bash
        run: |
          echo "Intel install:"
          ls -als ./releases/windows/intel64/*.exe
          cd ./releases/windows/intel64
          echo "PKG_NAME_INTEL=$(ls *.pkg | head -n 1)" >> $GITHUB_ENV
          cd ../../../..

      - name: Upload intel64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME_INTEL }}
          path: ./releases/windows/intel64/${{ env.PKG_NAME_INTEL }}
